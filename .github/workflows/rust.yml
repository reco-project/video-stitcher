name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Restrict default permissions to read-only. Jobs that need more
# declare their own permissions block.
permissions:
  contents: read

# Cancel superseded PR runs immediately, but let branch pushes finish
# so baseline caches stay warm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Stage 1 helper — classify changed paths on pull requests so unrelated PRs
  # skip heavy untouched checks while failing open on non-PR or non-merge refs.
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      reco_core: ${{ steps.filter.outputs.reco_core }}
      deps: ${{ steps.filter.outputs.deps }}
      ffmpeg_sdk: ${{ steps.filter.outputs.ffmpeg_sdk }}
      inference: ${{ steps.filter.outputs.inference }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]] || ! git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            echo "reco_core=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            echo "ffmpeg_sdk=true" >> "$GITHUB_OUTPUT"
            echo "inference=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"

          match() {
            if grep -Eq "$1" <<< "$changed"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "reco_core=$(match '^(crates/reco-core/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.cargo/)')" >> "$GITHUB_OUTPUT"
          echo "deps=$(match '^(Cargo\.toml$|Cargo\.lock$|crates/[^/]+/Cargo\.toml$|deny\.toml$|\.github/deny-dev-advisories\.inc$)')" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_sdk=$(match '^(scripts/|\.github/actions/linux-desktop-sdk/|crates/reco-io/|Cargo\.lock$)')" >> "$GITHUB_OUTPUT"
          echo "inference=$(match '^(crates/reco-detect/|crates/reco-autocam/|Cargo\.lock$)')" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Stage 1 — PR fast gate (required by branch protection on main).
  #
  # Runs formatting and default-feature workspace clippy only so PR feedback
  # stays compact and the rust-cache stays small. Full feature-boundary clippy
  # lanes run in Stage 2 (rust-extended.yml).
  # ===========================================================================
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: check-fast
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/linux-build-deps
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===========================================================================
  # Stage 1 — PR fast tests (required by branch protection on main).
  #
  # Runs default workspace unit and integration tests without software lavapipe,
  # --features profiling, or repeated wgpu-free rebuilds (all covered in Stage 2
  # via rust-extended.yml). Because reco-core has no workspace dependencies, PRs
  # to dev that do not touch reco-core or Cargo/toolchain files run downstream
  # workspace tests directly (~35s vs ~6-8m for reco-core's coverage-map tests).
  # ===========================================================================
  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: test-fast
          env-vars: CARGO_PROFILE_TEST_DEBUG
          save-if: ${{ github.event_name == 'push' }}
      - uses: ./.github/actions/linux-build-deps
        with:
          extra-packages: ffmpeg
      - name: Run tests (workspace excluding untouched reco-core)
        if: github.event_name == 'pull_request' && github.base_ref != 'main' && needs.changes.outputs.reco_core != 'true'
        run: cargo test --workspace --exclude reco-core
      - name: Run tests and warm full test cache (push)
        if: github.event_name == 'push'
        run: |
          cargo test --workspace --exclude reco-core
          cargo test -p reco-core --no-run
      - name: Run tests (full workspace)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || needs.changes.outputs.reco_core == 'true'))
        run: cargo test --workspace

  # ===========================================================================
  # Stage 1 — Secret scanning (~7s, runs on every PR and push).
  # ===========================================================================
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Run the gitleaks CLI directly instead of gitleaks-action. The action
      # requires a license key for org repos, and that secret is unavailable
      # to pull_request runs from forks, so it failed on every community PR.
      # The binary is free for everyone and needs no secret, so it scans fork
      # and internal PRs identically.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan working tree for secrets
        run: gitleaks dir . --redact --verbose

  # ===========================================================================
  # Stage 1 (path-filtered) — cargo-deny supply-chain, licenses, and bans.
  # Runs on PRs only when manifests, lockfile, or deny config change, plus on
  # pushes to dev/main, PRs to main, workflow_dispatch, and ci-full PRs.
  # ===========================================================================
  deny:
    name: cargo-deny
    needs: changes
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        needs.changes.outputs.deps == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci-full')
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Apply dev-only maintenance exceptions
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        run: |
          sed -i '/^\[advisories\]$/,/^\[/ { /^ignore = \[$/r .github/deny-dev-advisories.inc
          }' deny.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # ===========================================================================
  # Stage 1 (path-filtered) — Fast CUDA/TensorRT inference checks on PRs that
  # touch reco-detect, reco-autocam, or Cargo.lock without compiling NCNN or
  # running Valgrind (covered in Stage 3 via rust-extended.yml).
  # ===========================================================================
  inference-fast:
    name: Inference backends (fast)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'ci-full') &&
      needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: gpu-backends
          save-if: false
      - uses: ./.github/actions/linux-build-deps
      - name: Check reco-detect (cuda + load-dynamic)
        run: cargo check -p reco-detect --features cuda,load-dynamic
      - name: Test TensorRT cache keys
        run: cargo test -p reco-detect --features tensorrt,load-dynamic --lib ort_session::cache::tests

  # ===========================================================================
  # Stage 2 + path-filtered PR — Pinned FFmpeg SDK and Linux relocation.
  # Runs on push to dev/main, PRs to main, workflow_dispatch, ci-full PRs, and
  # PRs touching scripts/, .github/actions/linux-desktop-sdk/, crates/reco-io/,
  # or Cargo.lock.
  # ===========================================================================
  ffmpeg-sdk:
    name: Pinned FFmpeg and Linux relocation
    needs: changes
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        needs.changes.outputs.ffmpeg_sdk == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci-full')
      ))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: ./.github/actions/linux-desktop-sdk
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: ffmpeg-sdk
          key: ${{ hashFiles('scripts/ffmpeg-sdk.json', 'scripts/build_ffmpeg_sdk.py') }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Packaging regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: I/O tests on the pinned runtime
        run: |
          cargo test -p reco-io --no-default-features --features ffmpeg
          cargo test -p reco-io --no-default-features --features ffmpeg --lib --no-run --message-format=json > "$RUNNER_TEMP/io-artifacts.json"
          test_binary=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .profile.test and .target.kind == ["lib"]) | .executable] | if length == 1 then .[0] else error("expected one I/O test executable") end' "$RUNNER_TEMP/io-artifacts.json")
          cp "$test_binary" "$RUNNER_TEMP/reco-io-tests"
      - name: Build CLI on the pinned runtime
        run: cargo build -p reco-cli --features load-dynamic
      - name: Build mandatory inference probe
        run: |
          cargo test -p reco-detect --features load-dynamic --lib --no-run --message-format=json > "$RUNNER_TEMP/detect-artifacts.json"
          test_binary=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .profile.test and .target.name == "reco_detect") | .executable] | if length == 1 then .[0] else error("expected one detection test executable") end' "$RUNNER_TEMP/detect-artifacts.json")
          cp "$test_binary" "$RUNNER_TEMP/reco-detect-tests"
      - name: Stage desktop CLI notices and dependency sources
        run: |
          curl -fL --max-time 120 "$(jq -r '.onnxruntime.source' scripts/linux-desktop.json)" -o "$RUNNER_TEMP/onnxruntime.whl"
          python3 scripts/stage_linux_desktop.py --sdk "$FFMPEG_DIR" --ort-archive "$RUNNER_TEMP/onnxruntime.whl" \
            --library-dir /usr/lib/x86_64-linux-gnu --output "$RUNNER_TEMP/desktop-cli" target/debug/reco
          python3 scripts/fetch_linux_sources.py "$RUNNER_TEMP/desktop-cli/notices/required-sources.json" --output "$RUNNER_TEMP/dependency-sources"
      - name: Relocate and exercise native runtime
        shell: bash
        run: |
          python3 scripts/bundle_linux.py \
            --library-dir "$FFMPEG_DIR/lib" --library-dir /usr/lib/x86_64-linux-gnu \
            --max-glibc "$(jq -r '.glibc_ceiling' scripts/linux-desktop.json)" --output "$RUNNER_TEMP/ffmpeg-package" \
            "$FFMPEG_DIR/bin/ffmpeg" "$FFMPEG_DIR/bin/ffprobe" "$RUNNER_TEMP/reco-io-tests" target/debug/reco \
            "$RUNNER_TEMP/reco-detect-tests" "$RUNNER_TEMP/desktop-cli/libonnxruntime.so"
          mv "$RUNNER_TEMP/ffmpeg-package" "$RUNNER_TEMP/relocated package"
          mv "$FFMPEG_DIR" "$FFMPEG_DIR-hidden"
          trap 'mv "$FFMPEG_DIR-hidden" "$FFMPEG_DIR"' EXIT
          python3 scripts/verify_ffmpeg_bundle.py "$RUNNER_TEMP/relocated package"
