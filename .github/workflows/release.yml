name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-sdk:
    uses: ./.github/workflows/windows-sdk.yml

  build:
    needs: windows-sdk
    # A failed Windows SDK must not suppress the independent Unix packages.
    if: always() && !cancelled()
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-arm64 cross-compile is fragile (target install + cross deps).
        # fail-fast: false ensures other platforms still build if it fails.
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: reco

          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: reco
            cross: true

          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            binary: reco

          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel
            binary: reco

          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: reco.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}-${{ matrix.name == 'linux-x86_64' && hashFiles('scripts/ffmpeg-sdk.json', 'scripts/build_ffmpeg_sdk.py') || matrix.name == 'windows-x86_64' && hashFiles('scripts/ffmpeg-sdk.json', 'scripts/windows-sdk-sources.json', 'scripts/build_windows_ffmpeg_sdk.py', 'scripts/fetch_windows_sources.py') || 'system' }}

      # ----------------------------------------------------------------
      # Linux x86_64 (native) dependencies
      # ----------------------------------------------------------------
      - name: Set up pinned Linux desktop SDK
        if: runner.os == 'Linux' && !matrix.cross
        uses: ./.github/actions/linux-desktop-sdk

      # ----------------------------------------------------------------
      # Linux ARM64 cross-compilation
      #
      # Sets up multiarch apt sources so we can install arm64 FFmpeg dev
      # packages alongside the amd64 host packages. The approach:
      #   1. Restrict existing sources to amd64 (prevent 404s on ports)
      #   2. Add arm64 sources from ports.ubuntu.com
      #   3. Install the aarch64 cross-toolchain + arm64 FFmpeg libraries
      #
      # KNOWN LIMITATION: The sed command that patches ubuntu.sources
      # assumes DEB822 format (Ubuntu 24.04+). If the runner image
      # changes format, apt-get update may show 404 warnings for arm64
      # from archive.ubuntu.com -- these are harmless but noisy.
      # If they become errors, replace the sed with a full sources
      # rewrite (see comments in-line).
      # ----------------------------------------------------------------
      - name: Set up ARM64 cross-compilation
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")

          # Restrict existing sources to amd64 to prevent apt from
          # looking for arm64 packages on archive.ubuntu.com (404).
          # Targets DEB822 stanzas by inserting Architectures before Suites.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Suites:/Architectures: amd64\nSuites:/' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          # arm64 packages live on ports.ubuntu.com, not archive.ubuntu.com
          cat <<SOURCES | sudo tee /etc/apt/sources.list.d/arm64-cross.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES

          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config clang \
            libavcodec-dev:arm64 libavformat-dev:arm64 libavutil-dev:arm64 \
            libswscale-dev:arm64 libavdevice-dev:arm64 libavfilter-dev:arm64 \
            libswresample-dev:arm64

          # Tell cargo & pkg-config how to cross-compile
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      # ----------------------------------------------------------------
      # macOS dependencies (works for both ARM64 and Intel runners)
      # ----------------------------------------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Set up pinned Windows desktop SDK
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-desktop-sdk

      # ----------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------
      # dlopen("libonnxruntime.so"/".dylib") consults the executable's
      # runpath, so $ORIGIN/@loader_path lets the bundled runtime resolve
      # from the extracted tarball without ORT_DYLIB_PATH or a system
      # install (#446).
      - name: Set bundled-library rpath (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,@loader_path' >> "$GITHUB_ENV"
          else
            echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
          fi

      - name: Build release binaries
        if: matrix.name != 'linux-x86_64' && runner.os != 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }} -p reco-cli --features load-dynamic
          cargo build --release --target ${{ matrix.target }} -p reco-gui --features load-dynamic || echo "::warning::reco-gui build failed on ${{ matrix.name }} (cross-compile or missing deps)"

      - name: Build Windows desktop binaries
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --release --locked --target ${{ matrix.target }} -p reco-cli -p reco-gui --features load-dynamic

      - name: Build Linux desktop binaries
        if: matrix.name == 'linux-x86_64'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --release --locked --target ${{ matrix.target }} -p reco-cli -p reco-gui --features load-dynamic

      # ----------------------------------------------------------------
      # ONNX Runtime (bundled for AI detection)
      # ----------------------------------------------------------------
      - name: Download ONNX Runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-osx-${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}-1.24.4.tgz" -o /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          ORT_LIB=$(find /tmp/onnxruntime-* -name "libonnxruntime*.dylib" | head -1)
          echo "ORT_LIB=$ORT_LIB" >> "$GITHUB_ENV"
          echo "Bundled ONNX Runtime 1.24.4 ($(du -h "$ORT_LIB" | cut -f1))"

      - name: Download ONNX Runtime (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          curl -fL --max-time 120 "$(jq -r '.onnxruntime.source' scripts/linux-desktop.json)" -o "$RUNNER_TEMP/onnxruntime.whl"

      # ----------------------------------------------------------------
      # Package
      # ----------------------------------------------------------------
      - name: Package and verify Linux desktop
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: 2
        run: |
          python3 -m unittest discover -s scripts/tests -v
          cli="reco-cli-$RELEASE_TAG-linux-x86_64"
          gui="reco-gui-$RELEASE_TAG-linux-x86_64"
          sources="reco-sources-$RELEASE_TAG-linux-x86_64"
          for item in "$cli:reco" "$gui:reco-gui"; do
            python3 scripts/stage_linux_desktop.py --sdk "$FFMPEG_DIR" --ort-archive "$RUNNER_TEMP/onnxruntime.whl" \
              --library-dir /usr/lib/x86_64-linux-gnu --output "${item%:*}" "target/$TARGET/release/${item##*:}"
          done

          mkdir "$sources"
          jq -s 'add | unique_by([.package, .version])' "$cli/notices/required-sources.json" "$gui/notices/required-sources.json" > "$RUNNER_TEMP/required-sources.json"
          python3 scripts/fetch_linux_sources.py "$RUNNER_TEMP/required-sources.json" --output "$sources/native"
          cp -R "$FFMPEG_DIR/share/reco-ffmpeg" "$sources/ffmpeg"
          git diff --exit-code
          git diff --cached --exit-code
          git archive --format=tar --output="$RUNNER_TEMP/reco-source.tar" HEAD
          mkdir "$sources/reco"
          tar xf "$RUNNER_TEMP/reco-source.tar" -C "$sources/reco"
          git rev-parse HEAD > "$sources/REVISION"
          rustc -Vv > "$sources/TOOLCHAIN"
          (
            cd "$sources/reco"
            mkdir -p .cargo
            cargo vendor --locked --versioned-dirs vendor >> .cargo/config.toml
            cargo metadata --offline --locked --format-version=1 > "$RUNNER_TEMP/vendored-metadata.json"
          )

          cargo test --release --locked --target "$TARGET" -p reco-detect --features load-dynamic --lib --no-run --message-format=json > "$RUNNER_TEMP/detect-artifacts.json"
          test_binary=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .profile.test and .target.name == "reco_detect") | .executable] | if length == 1 then .[0] else error("expected one detection test executable") end' "$RUNNER_TEMP/detect-artifacts.json")
          cp "$test_binary" "$RUNNER_TEMP/reco-detect-tests"
          python3 scripts/bundle_linux.py --library-dir "$cli" \
            --max-glibc "$(jq -r '.glibc_ceiling' scripts/linux-desktop.json)" --output "$RUNNER_TEMP/inference-probe" \
            "$RUNNER_TEMP/reco-detect-tests" "$cli/libonnxruntime.so" "$cli/ffmpeg" "$cli/ffprobe"

          mv "$FFMPEG_DIR" "$FFMPEG_DIR-hidden"
          trap 'mv "$FFMPEG_DIR-hidden" "$FFMPEG_DIR"' EXIT
          python3 scripts/verify_ffmpeg_bundle.py "$cli"
          python3 scripts/verify_ffmpeg_bundle.py "$gui"
          python3 scripts/verify_ffmpeg_bundle.py "$RUNNER_TEMP/inference-probe"
          tar czf "$cli.tar.gz" "$cli"
          tar czf "$gui.tar.gz" "$gui"
          tar czf "$sources.tar.gz" "$sources"

      - name: Package CLI (Unix)
        if: runner.os != 'Windows' && matrix.name != 'linux-x86_64'
        run: |
          staging="reco-cli-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          # Bundle ONNX Runtime under the exact name ort dlopens; a
          # missing runtime used to hang --model runs outright (#446).
          if [ -n "$ORT_LIB" ] && [ -f "$ORT_LIB" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              cp "$ORT_LIB" "$staging/libonnxruntime.dylib"
            else
              cp "$ORT_LIB" "$staging/libonnxruntime.so"
            fi
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package GUI (Unix)
        if: runner.os != 'Windows' && matrix.name != 'linux-x86_64'
        run: |
          gui_bin="target/${{ matrix.target }}/release/reco-gui"
          if [ -f "$gui_bin" ]; then
            staging="reco-gui-${{ github.ref_name }}-${{ matrix.name }}"
            mkdir "$staging"
            cp "$gui_bin" "$staging/"
            # Bundle ONNX Runtime under the exact name ort dlopens - the
            # versioned filename it previously kept was never found (#446).
            if [ -n "$ORT_LIB" ] && [ -f "$ORT_LIB" ]; then
              if [ "$RUNNER_OS" = "macOS" ]; then
                cp "$ORT_LIB" "$staging/libonnxruntime.dylib"
              else
                cp "$ORT_LIB" "$staging/libonnxruntime.so"
              fi
            fi
            cp LICENSE THIRD_PARTY_NOTICES.md "$staging/"
            tar czf "$staging.tar.gz" "$staging"
          fi

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "reco-cli-${{ github.ref_name }}-${{ matrix.name }}"
          python scripts/stage_windows_desktop.py "target/${{ matrix.target }}/release/${{ matrix.binary }}" --sdk "$env:FFMPEG_DIR" --runtime-cache "$env:RUNNER_TEMP/windows-runtimes" --output $staging
          if ($LASTEXITCODE -ne 0) { throw 'CLI staging failed' }

      - name: Verify Windows packaged runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/verify-windows-desktop
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        with:
          package: reco-cli-${{ github.ref_name }}-${{ matrix.name }}

      - name: Archive verified Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "reco-cli-${{ github.ref_name }}-${{ matrix.name }}"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "reco-gui-${{ github.ref_name }}-${{ matrix.name }}"
          python scripts/stage_windows_desktop.py "target/${{ matrix.target }}/release/reco-gui.exe" --sdk "$env:FFMPEG_DIR" --runtime-cache "$env:RUNNER_TEMP/windows-runtimes" --output $staging
          if ($LASTEXITCODE -ne 0) { throw 'GUI staging failed' }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Download Windows corresponding sources
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ffmpeg-sources
          path: windows-sources

      - name: Name Windows corresponding sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item windows-sources/windows-ffmpeg-sources.tar.gz "reco-ffmpeg-sources-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reco-${{ matrix.name }}
          path: reco-*-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  # ====================================================================
  # Create the GitHub Release and attach all platform binaries
  # ====================================================================
  release:
    permissions:
      contents: write
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reco-*
          path: artifacts
          merge-multiple: true

      - name: Download AI model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.5.2 \
            --repo "${{ github.repository }}" \
            --pattern "yolo26n.onnx" \
            --pattern "yolo26n_640.onnx" \
            --dir artifacts
          cd artifacts
          sha256sum --check <<'CHECKSUMS'
          3f6e5b6c9adaaf7f033810526f12826557e92fafaffa6df2d0ed06512f5e3821  yolo26n.onnx
          30fde6857b65f6256c9924c3340810a03f73fc42503df9e34156089bda9496ac  yolo26n_640.onnx
          CHECKSUMS

      - name: Generate checksums
        run: |
          cd artifacts
          tag="$GITHUB_REF_NAME"
          for platform in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64 windows-x86_64; do
            ext=tar.gz
            if [ "$platform" = windows-x86_64 ]; then ext=zip; fi
            test -s "reco-cli-$tag-$platform.$ext"
            # The ARM64 cross build ships the GUI only when available.
            if [ "$platform" != linux-arm64 ]; then test -s "reco-gui-$tag-$platform.$ext"; fi
          done
          test -s "reco-sources-$tag-linux-x86_64.tar.gz"
          test -s "reco-ffmpeg-sources-$tag-windows-x86_64.tar.gz"
          sha256sum reco-* yolo26n.onnx yolo26n_640.onnx > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if echo "${{ github.ref_name }}" | grep -qE "(alpha|beta|rc)"; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            $prerelease_flag \
            artifacts/*
