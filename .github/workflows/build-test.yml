name: Build Test Binary

on:
  workflow_dispatch:
  push:
    branches: [fix/v0.5.0-release-prep, fix/10bit-d3d11va]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  windows-sdk:
    uses: ./.github/workflows/windows-sdk.yml

  build-windows:
    name: Windows ${{ matrix.application }}
    needs: windows-sdk
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: cli
            binary: reco.exe
          - application: gui
            binary: reco-gui.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.windows-sdk.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ hashFiles('scripts/ffmpeg-sdk.json', 'scripts/windows-sdk-sources.json', 'scripts/build_windows_ffmpeg_sdk.py', 'scripts/fetch_windows_sources.py') }}
      - uses: ./.github/actions/windows-desktop-sdk

      - name: Build application
        run: cargo build --release --locked -p reco-${{ matrix.application }} --features load-dynamic

      - name: Bundle application and runtimes
        shell: pwsh
        run: |
          python scripts/stage_windows_desktop.py "target/release/${{ matrix.binary }}" --sdk "$env:FFMPEG_DIR" --runtime-cache "$env:RUNNER_TEMP/windows-runtimes" --output artifact
          if ($LASTEXITCODE -ne 0) { throw 'Desktop staging failed' }

      - uses: ./.github/actions/verify-windows-desktop
        with:
          package: artifact

      - uses: actions/upload-artifact@v7
        with:
          name: reco-${{ matrix.application }}-windows-test
          path: artifact/
          if-no-files-found: error
