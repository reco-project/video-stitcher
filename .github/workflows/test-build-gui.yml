name: Test Build (Windows GUI)

# On-demand Windows reco-gui build for testing a branch on a Windows box
# without a local FFmpeg/clang toolchain. Produces a runnable bundle
# (reco-gui.exe + FFmpeg/ONNX/DirectML DLLs) as a downloadable artifact.
# Not a release: no tag, no publish.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows-sdk:
    uses: ./.github/workflows/windows-sdk.yml
    with:
      ref: ${{ inputs.ref }}

  build:
    needs: windows-sdk
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.windows-sdk.outputs.revision }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-gui-windows-${{ hashFiles('scripts/ffmpeg-sdk.json', 'scripts/windows-sdk-sources.json', 'scripts/build_windows_ffmpeg_sdk.py', 'scripts/fetch_windows_sources.py') }}

      - uses: ./.github/actions/windows-desktop-sdk

      - name: Build reco-gui
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p reco-gui --features load-dynamic

      - name: Bundle
        shell: pwsh
        run: |
          $staging = "reco-gui-test-windows-x86_64"
          python scripts/stage_windows_desktop.py "target/x86_64-pc-windows-msvc/release/reco-gui.exe" --sdk "$env:FFMPEG_DIR" --runtime-cache "$env:RUNNER_TEMP/windows-runtimes" --output $staging
          if ($LASTEXITCODE -ne 0) { throw 'Desktop staging failed' }

      - uses: ./.github/actions/verify-windows-desktop
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        with:
          package: reco-gui-test-windows-x86_64

      - name: Archive verified package
        shell: pwsh
        run: Compress-Archive -Path reco-gui-test-windows-x86_64 -DestinationPath reco-gui-test-windows-x86_64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reco-gui-test-windows
          path: reco-gui-test-windows-x86_64.zip
          if-no-files-found: error
