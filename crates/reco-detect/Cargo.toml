[package]
publish = false
name = "reco-detect"
version = "0.5.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Detection backends for reco: YOLO (CPU/GPU/TensorRT/Metal), future motion/color detectors"
links = "tensorrt_wrapper"

[features]
default = ["ort"]
ort = ["dep:ort", "dep:dirs"]
cuda = ["ort", "ort/cuda"]
tensorrt = ["ort", "ort/tensorrt", "dep:hmac-sha256"]
coreml = ["ort", "ort/coreml"]
directml = ["ort", "ort/directml"]
load-dynamic = ["ort", "ort/load-dynamic", "dep:libloading"]
tensorrt-native = []
ncnn = []
profiling = ["reco-core/profiling"]

[dependencies]
reco-core = { path = "../reco-core" }
# Pin `api-24` explicitly because ort 2.0.0-rc.15 defaults to `api-31`,
# while desktop packaging and CI (`scripts/*-desktop.json`, `release.yml`)
# ship ONNX Runtime 1.24.4. Targeting C API 24 keeps `load-dynamic`
# compatible with 1.24.4 and newer runtimes alike.
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-24",
] }
dirs = { version = "6", optional = true }
hmac-sha256 = { version = "1.1.14", optional = true }
libloading = { version = "0.9", optional = true }
wgpu = "28"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"

# libloading: used by npp_interop (dynamically loads NPP libraries so
# the compiled binary keeps running on machines without CUDA installed,
# reporting NotAvailable instead of failing to start).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = "0.9"

# ort_session registers the DirectML EP on Windows; without ort's
# `directml` feature the registration silently falls back to the CPU
# EP, so every Windows ort build carries it. Keep `default-features = false`
# so feature unification does not pull in ort's default `api-31`.
[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["directml"] }

# Apple frameworks: used by coreml_inference (CoreML model wrap) and
# metal_compute (Metal compute pipeline for YOLO preprocess). These
# are detect-preprocess concerns that used to live in reco-core; they
# moved here once it was clear they're only consumed by reco-detect's
# backends (see M5 revised analysis).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
foreign-types = "0.5"
metal = "0.33"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject"] }
objc2-metal = "0.3"
objc2-core-ml = { version = "0.3", features = [
    "MLModel",
    "MLMultiArray",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLDictionaryFeatureProvider",
    "MLModelConfiguration",
    "block2",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
