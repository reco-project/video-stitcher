[package]
publish = false
name = "reco-core"
version = "0.5.3-beta.2"
edition.workspace = true
rust-version.workspace = true
description = "GPU-accelerated panoramic video stitching engine"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"
readme = "README.md"

[features]
default = ["gpu"]
# The wgpu render stack: GPU executor, engine, session, interop, GPU
# lens tools. Disable (`--no-default-features`) for the wgpu-free
# leaf on GPU-less targets (calibration, geometry, projection, CPU
# stitch, source/detect/encoder traits).
gpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:bytemuck",
    "dep:ash",
    "dep:libc",
    "dep:windows",
    "dep:metal",
    "dep:foreign-types",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:objc2-core-ml",
    "dep:block2",
]
profiling = ["tracing"]

[dependencies]
wgpu = { version = "28", features = ["vulkan-portability"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
pollster = { version = "0.4", optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Security",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# The `metal` crate (0.33) is wgpu-hal 28's Metal backend dependency.
# We use it directly for interop with VideoToolbox and compute shaders.
# When wgpu moves back to objc2-metal (likely 29+), this dep goes
# away and metal_interop.rs / metal_compute.rs revert to the
# objc2-metal API. The old code is preserved in git history at
# commit 62d62c8 (pre-wgpu-28 spike HEAD).
metal = { version = "0.33", optional = true }
foreign-types = { version = "0.5", optional = true }
# Kept for reco-detect's CoreML path (still on objc2-core-ml 0.3).
# When metal_compute / metal_interop drop objc2-metal, these two
# may also become unnecessary if no other module uses them.
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSObject"] }
objc2-core-ml = { version = "0.3", optional = true, features = [
    "MLModel", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider",
    "MLDictionaryFeatureProvider", "MLModelConfiguration",
    "block2",
] }
block2 = { version = "0.6", optional = true }

[dev-dependencies]
approx = "0.5"
env_logger = "0.11"
libc = "0.2"
tempfile = "3"
