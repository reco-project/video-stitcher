[package]
publish = false
name = "reco-calibrate"
version = "0.5.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stereo camera calibration from pixel overlap"

[dependencies]
reco-core = { path = "../reco-core" }
basin = { version = "=1.15.1", default-features = false }
image = { version = "0.25", default-features = false }
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "2f4218b" }
log = "0.4"
nalgebra = "0.35"
rayon = "1.12"
ciborium = "0.2"
flate2 = "1"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
reco-io = { path = "../reco-io", optional = true }

[features]
profiling = ["reco-core/profiling"]
io = ["dep:reco-io"]
