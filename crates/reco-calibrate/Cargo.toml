[package]
publish = false
name = "reco-calibrate"
version = "0.5.3-beta.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stereo camera calibration for reco: feature matching and position optimization"

[dependencies]
reco-core = { path = "../reco-core" }
# Vendored AKAZE dependencies (was: akaze git dep, vendored for bug fixes)
ndarray = { version = "0.16", features = ["rayon"] }
nshare = { version = "0.10", features = ["ndarray", "image"] }
primal = "0.3"
float-ord = "0.3"
basin = { version = "=1.15.1", default-features = false }
image = { version = "0.25", default-features = false }
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "2f4218b" }
log = "0.4"
nalgebra = "0.35"
rayon = "1.12"
ciborium = "0.2"
flate2 = "1"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
reco-io = { path = "../reco-io", optional = true }

[features]
profiling = ["reco-core/profiling"]
io = ["dep:reco-io"]

[dev-dependencies]
approx = "0.5"
pollster = "0.4"
reco-io = { path = "../reco-io" }
