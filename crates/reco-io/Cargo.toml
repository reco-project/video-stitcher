[package]
publish = false
name = "reco-io"
version = "0.5.3-beta.2"
edition.workspace = true
rust-version.workspace = true
description = "Pluggable frame I/O backends for Reco (FFmpeg, GStreamer, ...)"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"

[features]
default = ["ffmpeg", "gpu"]
gpu = ["reco-core/gpu"]
ffmpeg = ["dep:ffmpeg-next", "dep:tempfile"]
rpi = ["ffmpeg", "ffmpeg-next/rpi"]
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
libcamera = ["dep:libc"]
v4l2 = ["dep:libc"]
profiling = ["tracing", "reco-core/profiling"]
# Opt-in user-preference persistence for consumers. Serde +
# serde_json are unconditional (JsonlSink uses them); this flag
# only gates the `directories` crate and the config plumbing.
config = ["dep:directories"]
# FFmpeg replay wrappers; CPU pack/unpack primitives are unconditional.
stacked-output = ["ffmpeg"]

[dependencies]
reco-core = { path = "../reco-core", default-features = false }
log = "0.4"
thiserror = "2"
tracing = { workspace = true, optional = true }

# FFmpeg backend
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }

# GStreamer backend
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }

# Serde + serde_json are unconditional because `JsonlSink` (the
# default shipping `PipelineEventSink`) serializes events to JSON
# Lines. `config` also uses them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = { version = "6", optional = true }
libc = { version = "0.2", optional = true }
tempfile = { version = "3", optional = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
socket2 = "0.6"
