[package]
publish = false
name = "reco-scoreboard"
version = "0.5.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic HTML scoreboard package discovery and offscreen runtime"

[dependencies]
reco-core = { path = "../reco-core" }
anyhow = "1"
headless_chrome = { version = "1.0.22", default-features = false, features = ["offline"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
percent-encoding = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
