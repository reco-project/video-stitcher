<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1">
    <title>Reco Lacrosse Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="safe-area" aria-label="Lacrosse scoreboard">
        <section class="scoreboard"><div class="competition-row"><span id="competition" class="competition"></span><span id="status" class="status">LIVE</span></div><div class="match-row"><div class="team home"><span class="label">HOME</span><img id="home-logo" class="team-logo" alt=""><strong id="home-name" class="team-name">SHARKS</strong></div><strong id="home-score" class="score">0</strong><div class="center"><strong id="clock">00:00</strong><span id="period"></span><em id="detail"></em></div><strong id="away-score" class="score">0</strong><div class="team away"><span class="label">AWAY</span><img id="away-logo" class="team-logo" alt=""><strong id="away-name" class="team-name">LIONS</strong></div></div></section>
        <div id="custom-text" class="custom-text" hidden></div><img id="custom-logo" class="custom-logo" alt="" hidden>
    </main>
    <aside id="debug-controls" class="debug-controls" hidden>
        <header><strong>Edit Lacrosse scoreboard</strong><span id="editor-status">Live</span></header>
        <label>Competition<input data-bind="game.competition" type="text" maxlength="48"></label>
        <div class="form-grid"><label>Home team<input data-bind="home.shortName" type="text" maxlength="24"></label><label>Away team<input data-bind="away.shortName" type="text" maxlength="24"></label><label>Home score<input data-bind="home.score" type="number" min="0" max="999"></label><label>Away score<input data-bind="away.score" type="number" min="0" max="999"></label><label>Clock<input data-bind="game.clock" type="text" inputmode="numeric"></label><label>Period<input data-bind="game.period" type="number" min="1" max="12"></label><label>Home color<input data-bind="home.color" type="color"></label><label>Away color<input data-bind="away.color" type="color"></label><label class="check"><input data-bind="game.running" type="checkbox"> Clock running</label></div>
        <fieldset><legend>Lacrosse rules</legend><div class="form-grid"><label>Quarters<input data-bind="sport.periodCount" type="number" min="0" max="999"></label><label>Quarter length (min)<input data-bind="sport.periodDurationMinutes" type="number" min="0" max="999"></label><label>Shot clock<input data-bind="sport.shotClock" type="number" min="0" max="999"></label><label>Home penalties<input data-bind="sport.penaltiesHome" type="number" min="0" max="999"></label><label>Away penalties<input data-bind="sport.penaltiesAway" type="number" min="0" max="999"></label><label>Home man-up goals<input data-bind="sport.manUpHome" type="number" min="0" max="999"></label><label>Away man-up goals<input data-bind="sport.manUpAway" type="number" min="0" max="999"></label><label>Home timeouts<input data-bind="sport.timeoutsHome" type="number" min="0" max="999"></label><label>Away timeouts<input data-bind="sport.timeoutsAway" type="number" min="0" max="999"></label></div></fieldset>
        <fieldset><legend>Placement & branding</legend><div class="form-grid"><label>Scoreboard X<input data-bind="custom.scoreboard.x" type="number" min="0" max="1920"></label><label>Scoreboard Y<input data-bind="custom.scoreboard.y" type="number" min="0" max="1080"></label><label>Scoreboard scale<input data-bind="custom.scoreboard.scale" type="number" min="0.5" max="3" step="0.05"></label><label>Free text<input data-bind="custom.freeText.text" type="text" maxlength="48"></label><label>Text X<input data-bind="custom.freeText.x" type="number" min="0" max="1920"></label><label>Text Y<input data-bind="custom.freeText.y" type="number" min="0" max="1080"></label><label>Text scale<input data-bind="custom.freeText.scale" type="number" min="0.5" max="3" step="0.05"></label><label>Logo URL/path<input data-bind="custom.freeLogo.src" type="text" maxlength="160"></label><label>Logo X<input data-bind="custom.freeLogo.x" type="number" min="0" max="1920"></label><label>Logo Y<input data-bind="custom.freeLogo.y" type="number" min="0" max="1080"></label><label>Logo scale<input data-bind="custom.freeLogo.scale" type="number" min="0.5" max="3" step="0.05"></label></div></fieldset>
        <div class="score-buttons"><button type="button" data-score-team="home" data-score-amount="1">Home +1 Goal</button><button type="button" data-score-team="away" data-score-amount="1">Away +1 Goal</button></div><button id="reset-state" type="button" class="secondary">Reset demo state</button><button id="publish-state" type="button">Publish to active scoreboard</button><span id="message">Local preview ready.</span>
    </aside>
    <script src="../sdk/reco-scoreboard.js"></script>
    <script src="scoreboard.js"></script>
</body>
</html>
