<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1">
    <title>Reco Basketball Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="broadcast-safe-area" aria-label="Basketball scoreboard">
        <section class="scoreboard">
            <div class="team team-home">
                <span class="team-label">HOME</span>
                <strong id="home-name" class="team-name">SHARKS</strong>
                <span class="fouls">FOULS <strong id="home-fouls">3</strong></span>
            </div>
            <strong id="home-score" class="score">37</strong>

            <div class="game-center">
                <span id="competition" class="competition">REGIONAL LEAGUE</span>
                <strong id="clock" class="clock">07:42</strong>
                <span id="period" class="period">Q2 / 4</span>
                <span id="shot-clock-wrap" class="shot-clock">SHOT <strong id="shot-clock">18</strong></span>
            </div>

            <strong id="away-score" class="score">32</strong>
            <div class="team team-away">
                <span class="team-label">AWAY</span>
                <strong id="away-name" class="team-name">LIONS</strong>
                <span class="fouls">FOULS <strong id="away-fouls">5</strong></span>
            </div>
        </section>
    </main>

    <aside id="debug-controls" class="debug-controls" hidden>
        <header>
            <strong>Edit basketball scoreboard</strong>
            <span id="editor-status">Live</span>
        </header>
        <label>Competition<input id="competition-input" type="text" maxlength="48"></label>
        <div class="form-grid">
            <label>Home team<input id="home-name-input" type="text" maxlength="24"></label>
            <label>Away team<input id="away-name-input" type="text" maxlength="24"></label>
            <label>Quarters<input id="period-count-input" type="number" min="1" max="12"></label>
            <label>Quarter length (min)<input id="period-duration-input" type="number" min="1" max="99"></label>
            <label>Current quarter<input id="period-input" type="number" min="1" max="12"></label>
            <label>Shot clock<input id="shot-clock-input" type="number" min="0" max="99"></label>
            <label>Home team fouls<input id="home-fouls-input" type="number" min="0" max="99"></label>
            <label>Away team fouls<input id="away-fouls-input" type="number" min="0" max="99"></label>
        </div>
        <div class="button-row"><button data-score="home" data-points="1">Home +1</button><button data-score="home" data-points="2">+2</button><button data-score="home" data-points="3">+3</button></div>
        <div class="button-row"><button data-score="away" data-points="1">Away +1</button><button data-score="away" data-points="2">+2</button><button data-score="away" data-points="3">+3</button></div>
        <div class="button-row"><button id="toggle-clock">Start clock</button><button id="reset-clock">Reset clock</button><button id="next-period">Next quarter</button></div>
    </aside>

    <script src="../sdk/reco-scoreboard.js"></script>
    <script src="scoreboard.js"></script>
</body>
</html>
